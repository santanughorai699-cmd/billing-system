const { useState, useEffect, useCallback, useRef } = React;

const apiBase  = window.location.protocol === 'file:' ? 'http://localhost:8000' : '';
const TOKEN_KEY = 'bbs_token';
const USER_KEY  = 'bbs_user';
const PROFILE_AVATAR_KEY = 'bbs_avatar_';
const THEME_KEY = 'bbs_theme_preference';

async function api(path, { method = 'GET', body, token } = {}) {
  const headers = {};
  if (body !== undefined) headers['Content-Type'] = 'application/json';
  if (token) headers['Authorization'] = `Bearer ${token}`;

  const res = await fetch(`${apiBase}${path}`, {
    method, headers,
    body: body !== undefined ? JSON.stringify(body) : undefined,
  });
  let data = {};
  try { data = await res.json(); } catch (e) {}
  if (!res.ok) {
    const err = new Error(data.detail || `Request failed (${res.status})`);
    err.status = res.status;
    throw err;
  }
  return data;
}

// Input validation helpers
const validateName = (name) => /^[a-zA-Z\s]*$/.test(name);
const validateUserId = (userId) => /^[a-zA-Z]*$/.test(userId);
const validatePhone = (phone) => /^[0-9]*$/.test(phone) && phone.length <= 10;

/* ============================================================
   LOGIN SCREEN (Background set to your shop image with dark overlay)
   ============================================================ */
function LoginScreen({ onLogin }) {
  const [userId, setUserId]     = useState('');
  const [password, setPassword] = useState('');
  const [error, setError]       = useState('');
  const [busy, setBusy]         = useState(false);

  const submit = async (e) => {
    e.preventDefault();
    if (!validateUserId(userId)) {
      setError('User ID must contain only letters');
      return;
    }
    setBusy(true); setError('');
    try {
      const data = await api('/api/login', {
        method: 'POST',
        body: { user_id: userId.trim(), password },
      });
      onLogin(data);
    } catch (err) {
      setError(err.message);
    } finally {
      setBusy(false);
    }
  };

  return (
    <div className="min-h-screen relative flex items-center justify-center px-4 flex-col bg-cover bg-center"
         style={{ backgroundImage: `url('WhatsApp Image 2026-09-13 at 3.54.27 AM.jpeg')` }}>
      
      {/* Dark overlay so the login card stands out cleanly against the photo background */}
      <div className="absolute inset-0 bg-black/60 backdrop-blur-[2px]"></div>

      <div className="relative z-10 w-full max-w-md bg-white/95 backdrop-blur-md rounded-2xl shadow-2xl p-8 border border-white/20">
        <div className="text-center mb-8">
          <div className="text-4xl mb-2">🧾</div>
          <h1 className="text-2xl font-bold text-gray-900">Kalyani Embroidery</h1>
          <p className="text-sm text-gray-500 mt-1">Bill Management System</p>
        </div>

        {error && (
          <div className="mb-4 rounded-lg border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700">
            {error}
          </div>
        )}

        <form onSubmit={submit} className="space-y-4">
          <div>
            <label className="block text-sm font-medium text-gray-700 mb-1">User ID </label>
            <input type="text" value={userId} required
              onChange={(e) => setUserId(e.target.value.replace(/[^a-zA-Z]/g, ''))}
              autoComplete="username" placeholder="e.g. username"
              className="w-full px-3 py-2 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-blue-500 bg-white" />
          </div>
          <div>
            <label className="block text-sm font-medium text-gray-700 mb-1">Password</label>
            <input type="password" value={password} required
              onChange={(e) => setPassword(e.target.value)}
              autoComplete="current-password" placeholder="••••••••"
              className="w-full px-3 py-2 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-blue-500 bg-white" />
          </div>
          <button type="submit" disabled={busy}
            className="w-full py-2.5 bg-blue-600 text-white rounded-lg font-semibold hover:bg-blue-700 disabled:opacity-60 transition-colors shadow">
            {busy ? 'Signing in…' : 'Sign In'}
          </button>
        </form>

        <div className="mt-6 text-xs text-gray-600 bg-gray-50 border border-gray-200 rounded-lg p-3">
          <p className="font-semibold text-gray-700 mb-1">Default Accounts</p>
          <p>🛡️ Admin: <span className="font-mono">Samaresh</span></p>
          <p>👤 Employee: <span className="font-mono">Bimal</span></p>
          <p>👤 Employee: <span className="font-mono">Susama</span></p>
        </div>

      <div className="relative z-10 w-full max-w-xl">
        <DisclaimerFooter theme="dark" />

  );
}

/* ============================================================
   USER MANAGER (ADMIN ONLY)
   ============================================================ */
function UserManager({ request, currentUserId, theme, cardClass }) {
  const [users, setUsers]   = useState([]);
  const [error, setError]   = useState('');
  const [notice, setNotice] = useState('');
  const [form, setForm]     = useState({ user_id: '', password: '', name: '', role: 'employee' });

  const inputClass = `px-3 py-2 border rounded outline-none ${
    theme === 'dark' ? 'bg-gray-700 border-gray-600 text-white' : 'bg-white border-gray-300'
  }`;

  const load = async () => {
    try { setUsers(await request('/api/users')); setError(''); }
    catch (err) { setError(err.message); }
  };

  useEffect(() => { load(); }, []);

  const createUser = async (e) => {
    e.preventDefault();
    setError(''); setNotice('');
    
    if (!validateUserId(form.user_id)) {
      setError('User ID must contain only letters');
      return;
    }
    if (!validateName(form.name)) {
      setError('Name must contain only letters and spaces');
      return;
    }
    
    try {
      await request('/api/users', { method: 'POST', body: form });
      setNotice(`User "${form.user_id}" created.`);
      setForm({ user_id: '', password: '', name: '', role: 'employee' });
      load();
    } catch (err) { setError(err.message); }
  };

  const removeUser = async (id) => {
    if (!window.confirm(`Delete user "${id}"?`)) return;
    setError(''); setNotice('');
    try {
      await request(`/api/users/${id}`, { method: 'DELETE' });
      setNotice(`User "${id}" deleted.`);
      load();
    } catch (err) { setError(err.message); }
  };

  const resetPassword = async (id) => {
    const pw = window.prompt(`New password for "${id}":`);
    if (!pw) return;
    setError(''); setNotice('');
    try {
      await request(`/api/users/${id}/password`, { method: 'PUT', body: { password: pw } });
      setNotice(`Password updated for "${id}".`);
    } catch (err) { setError(err.message); }
  };

  const toggleRole = async (id, role) => {
    setError(''); setNotice('');
    try {
      await request(`/api/users/${id}`, { method: 'PUT', body: { role } });
      setNotice(`Role updated for "${id}".`);
      load();
    } catch (err) { setError(err.message); }
  };

  return (
    <div className={`${cardClass} border rounded-lg p-6 mb-6 shadow-sm`}>
      <h2 className="text-lg font-bold mb-4">👥 Manage Users</h2>

      {error  && <div className="mb-3 rounded border border-red-200 bg-red-50 px-3 py-2 text-sm text-red-700">{error}</div>}
      {notice && <div className="mb-3 rounded border border-green-200 bg-green-50 px-3 py-2 text-sm text-green-700">{notice}</div>}

      <form onSubmit={createUser} className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-3 mb-6">
        <input type="text" placeholder="User ID (letters)" required value={form.user_id}
          onChange={(e) => setForm({ ...form, user_id: e.target.value.replace(/[^a-zA-Z]/g, '') })} className={inputClass} />
        <input type="text" placeholder="Full Name (letters)" value={form.name}
          onChange={(e) => setForm({ ...form, name: e.target.value.replace(/[^a-zA-Z\s]/g, '') })} className={inputClass} />
        <input type="text" placeholder="Password" required value={form.password}
          onChange={(e) => setForm({ ...form, password: e.target.value })} className={inputClass} />
        <select value={form.role} onChange={(e) => setForm({ ...form, role: e.target.value })} className={inputClass}>
          <option value="employee">Employee</option>
          <option value="admin">Admin</option>
        </select>
        <button type="submit"
          className="col-span-1 sm:col-span-2 md:col-span-4 px-4 py-2 bg-green-600 text-white rounded hover:bg-green-700 font-medium">
          + Create User
        </button>
      </form>

      <div className="overflow-x-auto">
        <table className="w-full text-sm">
          <thead className={theme === 'dark' ? 'bg-gray-700 text-gray-200' : 'bg-gray-100 text-gray-700'}>
            <tr>
              <th className="px-4 py-2 text-left">User ID</th>
              <th className="px-4 py-2 text-left">Name</th>
              <th className="px-4 py-2 text-left">Role</th>
              <th className="px-4 py-2 text-left">Actions</th>
            </tr>
          </thead>
          <tbody className={`divide-y ${theme === 'dark' ? 'divide-gray-700' : 'divide-gray-200'}`}>
            {users.map((u) => (
              <tr key={u.user_id}>
                <td className="px-4 py-2 font-mono">{u.user_id}</td>
                <td className="px-4 py-2">{u.name}</td>
                <td className="px-4 py-2">
                  <span className={`px-2 py-0.5 rounded text-xs font-semibold ${
                    u.role === 'admin' ? 'bg-purple-100 text-purple-700' : 'bg-blue-100 text-blue-700'
                  }`}>{u.role.toUpperCase()}</span>
                </td>
                <td className="px-4 py-2 space-y-1 sm:space-y-0 sm:space-x-2 flex flex-col sm:flex-row">
                  <button onClick={() => resetPassword(u.user_id)}
                    className="px-3 py-1 bg-yellow-500 text-white rounded hover:bg-yellow-600 text-xs">
                    Reset Password
                  </button>
                  <button onClick={() => toggleRole(u.user_id, u.role === 'admin' ? 'employee' : 'admin')}
                    className="px-3 py-1 bg-indigo-500 text-white rounded hover:bg-indigo-600 text-xs">
                    Make {u.role === 'admin' ? 'Employee' : 'Admin'}
                  </button>
                  <button onClick={() => removeUser(u.user_id)}
                    disabled={u.user_id === currentUserId}
                    title={u.user_id === currentUserId ? "You can't delete yourself" : 'Delete user'}
                    className="px-3 py-1 bg-red-600 text-white rounded hover:bg-red-700 text-xs disabled:opacity-40 disabled:cursor-not-allowed">
                    Delete
                  </button>
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

/* ============================================================
   DASHBOARD
   ============================================================ */
function BillingDashboard({ session, onLogout }) {
  const { token, user } = session;
  const isAdmin = user.role === 'admin';

  const [bills, setBills]         = useState([]);
  const [error, setError]         = useState('');
  const [searchTerm, setSearch]   = useState('');
  const [theme, setTheme]         = useState(() => {
    return localStorage.getItem(THEME_KEY) || 'light';
  });

  const [showForm, setShowForm]   = useState(false);
  const [showUsers, setShowUsers] = useState(false);
  const [editingId, setEditingId] = useState(null);
  const [currentTime, setCurrentTime] = useState(new Date());

  const [showProfileModal, setShowProfileModal] = useState(false);
  const [avatarUrl, setAvatarUrl] = useState(() => {
    return localStorage.getItem(PROFILE_AVATAR_KEY + user.user_id) || '';
  });
  const fileInputRef = useRef(null);
  
  const [formData, setFormData]   = useState({
    name: '', phone: '', billNo: '', orderTrack: '', item: '', amount: '', down: ''
  });
  const [formError, setFormError] = useState('');

  useEffect(() => {
    const timer = setInterval(() => {
      setCurrentTime(new Date());
    }, 1000);
    return () => clearInterval(timer);
  }, []);

  const toggleTheme = () => {
    const nextTheme = theme === 'light' ? 'dark' : 'light';
    setTheme(nextTheme);
    localStorage.setItem(THEME_KEY, nextTheme);
  };

  const request = useCallback(async (path, options = {}) => {
    try { return await api(path, { ...options, token }); }
    catch (err) { if (err.status === 401) onLogout(); throw err; }
  }, [token, onLogout]);

  const loadBills = async () => {
    try { setBills(await request('/api/bills')); setError(''); }
    catch (err) {
      if (err.status !== 401)
        setError('Backend not reachable. Start it with: python index.py');
    }
  };

  useEffect(() => { loadBills(); }, []);

  const filteredBills = bills.filter(b =>
    b.name.toLowerCase().includes(searchTerm.toLowerCase()) ||
    b.billNo.includes(searchTerm) ||
    b.phone.includes(searchTerm)
  );

  const resetForm = () => {
    setEditingId(null);
    setFormData({ name: '', phone: '', billNo: '', orderTrack: '', item: '', amount: '', down: '' });
    setFormError('');
  };

  const handleEdit = (bill) => {
    setEditingId(bill.id);
    const phoneWithoutCode = bill.phone.replace(/^91/, '');
    setFormData({
      name: bill.name, phone: phoneWithoutCode, billNo: bill.billNo,
      orderTrack: bill.orderTrack, item: bill.item,
      amount: bill.amount.toString(), down: bill.down.toString(),
    });
    setShowForm(true);
    setFormError('');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };

  const handleSave = async (e) => {
    e.preventDefault();
    setFormError('');
    
    if (!validateName(formData.name)) {
      setFormError('Name must contain only letters and spaces');
      return;
    }
    if (!validatePhone(formData.phone)) {
      setFormError('Phone must be 10 digits (India only)');
      return;
    }
    if (!formData.billNo) {
      setFormError('Bill No is required');
      return;
    }
    
    const payload = {
      ...formData,
      amount: parseFloat(formData.amount) || 0,
      down: parseFloat(formData.down) || 0,
    };
    try {
      await request(`/api/bills${editingId ? `/${editingId}` : ''}`, {
        method: editingId ? 'PUT' : 'POST',
        body: payload,
      });
      await loadBills();
      resetForm();
      setShowForm(false);
      setError('');
    } catch (err) { 
      if (err.status !== 401) {
        setFormError(err.message);
      }
    }
  };

  const handleDelete = async (id) => {
    if (!window.confirm('Delete this bill permanently?')) return;
    try { await request(`/api/bills/${id}`, { method: 'DELETE' }); await loadBills(); }
    catch (err) { if (err.status !== 401) setError(err.message); }
  };

  const sendWhatsApp = (bill) => {
    const msg = `Hello ${bill.name},\n\nYour Bill Details:\n📋 Bill No: ${bill.billNo}\n📦 Item: ${bill.item}\n💰 Total Amount: ₹${bill.amount}\n✅ Advance Payment: ₹${bill.down}\n⏳ Pending Amount: ₹${bill.pending}\n📍 Order Track: ${bill.orderTrack}\n\nThank you!`;
    window.open(`https://wa.me/${bill.phone}?text=${encodeURIComponent(msg)}`, '_blank');
  };

  const confirmAndLogout = () => {
    if (window.confirm("Are you sure you want to log out?")) {
      onLogout();
    }
  };

  const handleImageUpload = (e) => {
    const file = e.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onloadend = () => {
        const result = reader.result;
        setAvatarUrl(result);
        localStorage.setItem(PROFILE_AVATAR_KEY + user.user_id, result);
      };
      reader.readAsDataURL(file);
    }
  };

  const removeAvatar = () => {
    setAvatarUrl('');
    localStorage.removeItem(PROFILE_AVATAR_KEY + user.user_id);
  };

  const hours = currentTime.getHours();
  let greetingText = 'Good Night 🌙';
  if (hours >= 5 && hours < 12) {
    greetingText = 'Good Morning ☀️';
  } else if (hours >= 12 && hours < 17) {
    greetingText = 'Good Afternoon 🌤️';
  } else if (hours >= 17 && hours < 21) {
    greetingText = 'Good Evening 🌆';
  }

  const bgClass    = theme === 'dark' ? 'bg-gray-900 text-white' : 'bg-slate-100 text-black';
  const cardClass  = theme === 'dark' ? 'bg-gray-800 border-gray-700 text-white' : 'bg-white border-gray-200 text-gray-900';
  const inputClass = `px-3 py-2 border rounded outline-none ${
    theme === 'dark' ? 'bg-gray-700 border-gray-600 text-white' : 'bg-white border-gray-300 text-gray-900'
  }`;

  return (
    <div className={`min-h-screen ${bgClass} flex flex-col transition-colors duration-300`}>
      <div className={`border-b shadow-sm ${theme === 'dark' ? 'bg-gray-800 border-gray-700' : 'bg-white border-gray-200'}`}>
        <div className="w-full max-w-7xl mx-auto px-3 sm:px-6 py-4">
          <div className="flex flex-col md:flex-row items-center justify-between gap-4">
            
            <div className="text-center md:text-left w-full md:w-auto">
              <div className="flex items-center justify-center md:justify-start gap-2">
                <span className="text-xl">👋</span>
                <h1 className="text-xl sm:text-2xl font-bold">{greetingText}, {user.name}</h1>
              </div>
              <p className={`text-xs sm:text-sm mt-0.5 ${theme === 'dark' ? 'text-gray-300' : 'text-gray-600'}`}>
                📅 {currentTime.toLocaleDateString()} | ⏰ {currentTime.toLocaleTimeString()} | {isAdmin ? 'Admin Portal' : 'Employee Portal'}
              </p>
            </div>

            <div className="flex flex-wrap items-center justify-center md:justify-end gap-2 sm:gap-3 w-full md:w-auto">
              <div className={`w-full sm:w-52 ${cardClass} border rounded-lg px-3 py-1.5 flex items-center gap-2 shadow-inner`}>
                <span className="text-gray-400">🔍</span>
                <input type="text" placeholder="Search bill..."
                  value={searchTerm}
                  onChange={(e) => setSearch(e.target.value)}
                  className={`w-full outline-none bg-transparent text-sm`} />
              </div>

              <button onClick={toggleTheme}
                title="Switch Theme"
                className={`p-2 rounded-lg ${cardClass} border text-sm font-semibold hover:opacity-80`}>
                {theme === 'light' ? '🌙 Dark Mode' : '☀️ Light Mode'}
              </button>

              <div onClick={() => setShowProfileModal(true)}
                className={`flex items-center gap-2 px-2.5 py-1.5 rounded-lg border cursor-pointer transition hover:opacity-80 ${theme === 'dark' ? 'bg-gray-700/60 border-gray-600' : 'bg-gray-100 border-gray-300'}`}
                title="Click to manage profile photo">
                <div className="w-8 h-8 rounded-full overflow-hidden flex items-center justify-center bg-gray-300 border border-gray-400">
                  {avatarUrl ? (
                    <img src={avatarUrl} alt="Profile" className="w-full h-full object-cover" />
                  ) : (
                    <span className="text-xs font-bold">{isAdmin ? '🛡️' : '👤'}</span>
                  )}
                </div>
                <div className="text-left leading-tight">
                  <p className="text-xs font-semibold">{user.user_id}</p>
                  <p className={`text-[10px] font-bold ${isAdmin ? 'text-purple-400' : 'text-blue-400'}`}>
                    {user.role.toUpperCase()}
                  </p>
                </div>
              </div>

              <button onClick={confirmAndLogout}
                className="px-3 py-2 rounded-lg bg-red-600 text-white text-xs sm:text-sm font-semibold hover:bg-red-700 shadow transition-all">
                Logout ⏏️
              </button>
            </div>

          </div>
        </div>
      </div>

      {showProfileModal && (
        <div className="fixed inset-0 z-50 bg-black/60 flex items-center justify-center p-4">
          <div className={`${cardClass} border rounded-xl max-w-sm w-full p-6 shadow-2xl relative`}>
            <button onClick={() => setShowProfileModal(false)}
              className="absolute top-3 right-3 text-gray-400 hover:text-gray-200 text-lg">✕</button>
            
            <h3 className="text-lg font-bold mb-4 text-center">🖼️ Profile Photo Settings</h3>
            
            <div className="flex flex-col items-center justify-center mb-6">
              <div className="w-24 h-24 rounded-full overflow-hidden border-4 border-blue-500 shadow-md mb-3 bg-gray-200 flex items-center justify-center">
                {avatarUrl ? (
                  <img src={avatarUrl} alt="User Avatar" className="w-full h-full object-cover" />
                ) : (
                  <span className="text-3xl">{isAdmin ? '🛡️' : '👤'}</span>
                )}
              </div>
              <p className="text-sm font-semibold">{user.name} ({user.user_id})</p>
              <p className="text-xs opacity-70">{isAdmin ? 'Administrator' : 'Employee'}</p>
            </div>

            <input type="file" ref={fileInputRef} onChange={handleImageUpload} accept="image/*" className="hidden" />

            <div className="space-y-2">
              <button onClick={() => fileInputRef.current.click()}
                className="w-full py-2 bg-blue-600 text-white rounded-lg font-medium text-sm hover:bg-blue-700 shadow">
                📷 Upload New Photo
              </button>

              {avatarUrl && (
                <button onClick={removeAvatar}
                  className="w-full py-2 bg-red-600 text-white rounded-lg font-medium text-sm hover:bg-red-700 shadow">
                  🗑️ Remove Current Photo
                </button>
              )}

              <button onClick={() => setShowProfileModal(false)}
                className={`w-full py-2 rounded-lg font-medium text-sm border ${theme === 'dark' ? 'border-gray-600 hover:bg-gray-700' : 'border-gray-300 hover:bg-gray-100'}`}>
                Close
              </button>
            </div>
          </div>
        </div>
      )}

      <div className="w-full max-w-7xl mx-auto px-2 sm:px-6 py-6 flex-grow">
        {error && (
          <div className="mb-6 rounded-lg border border-red-200 bg-red-50 px-4 py-3 text-red-700 text-sm">{error}</div>
        )}

        <div className="mb-6 flex flex-wrap gap-3">
          <button onClick={() => { resetForm(); setShowForm(!showForm); }}
            className="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 font-medium text-sm shadow">
            {showForm ? '✕ Cancel' : '+ Add New Bill'}
          </button>

          {isAdmin && (
            <button onClick={() => setShowUsers(!showUsers)}
              className="px-4 py-2 bg-purple-600 text-white rounded-lg hover:bg-purple-700 font-medium text-sm shadow">
              {showUsers ? '✕ Close Users' : '👥 Manage Users'}
            </button>
          )}
        </div>

        {isAdmin && showUsers && (
          <UserManager request={request} currentUserId={user.user_id}
            theme={theme} cardClass={cardClass} />
        )}

        {showForm && (
          <div className={`${cardClass} border rounded-lg p-4 sm:p-6 mb-6 shadow-md`}>
            <h2 className="text-lg font-bold mb-4">{editingId ? 'Edit Bill' : 'Add New Bill'}</h2>
            
            {formError && (
              <div className="mb-4 rounded border border-red-200 bg-red-50 px-3 py-2 text-sm text-red-700">{formError}</div>
            )}
            
            <form onSubmit={handleSave} className="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <input type="text" placeholder="Customer Name (letters only)" required value={formData.name}
                onChange={(e) => setFormData({ ...formData, name: e.target.value.replace(/[^a-zA-Z\s]/g, '') })} className={inputClass} />
              <div className="flex items-center">
                <span className={`px-3 py-2 ${theme === 'dark' ? 'bg-gray-700 text-gray-300 border-gray-600' : 'bg-gray-200 text-gray-700 border-gray-300'} border rounded-l font-semibold text-sm`}>+91</span>
                <input type="text" placeholder="10-digit phone" required value={formData.phone}
                  onChange={(e) => setFormData({ ...formData, phone: e.target.value.replace(/[^0-9]/g, '').slice(0, 10) })} 
                  className={`${inputClass} rounded-l-none flex-1`} maxLength="10" />
              </div>
              <input type="text" placeholder="Bill No" value={formData.billNo}
                onChange={(e) => setFormData({ ...formData, billNo: e.target.value })} className={inputClass} />
              <input type="text" placeholder="Order Track" value={formData.orderTrack}
                onChange={(e) => setFormData({ ...formData, orderTrack: e.target.value })} className={inputClass} />
              <input type="text" placeholder="Item" value={formData.item}
                onChange={(e) => setFormData({ ...formData, item: e.target.value })} className={inputClass} />
              <input type="number" placeholder="Total Amount (₹)" value={formData.amount}
                onChange={(e) => setFormData({ ...formData, amount: e.target.value })} className={inputClass} />
              <input type="number" placeholder="Advance Payment (₹)" value={formData.down}
                onChange={(e) => setFormData({ ...formData, down: e.target.value })} className={inputClass} />
              <button type="submit"
                className="px-4 py-2.5 bg-green-600 text-white rounded hover:bg-green-700 font-medium col-span-1 sm:col-span-2 shadow">
                {editingId ? '✓ Update Bill' : '✓ Save Bill'}
              </button>
            </form>
          </div>
        )}

        <div className={`${cardClass} border rounded-lg overflow-hidden shadow-sm`}>
          <div className="overflow-x-auto">
            <table className="w-full text-xs sm:text-sm whitespace-nowrap">
              <thead className={theme === 'dark' ? 'bg-gray-700 text-gray-200' : 'bg-gray-100 text-gray-700'}>
                <tr>
                  <th className="px-3 sm:px-4 py-3 text-left font-semibold">Name</th>
                  <th className="px-3 sm:px-4 py-3 text-left font-semibold">Phone</th>
                  <th className="px-3 sm:px-4 py-3 text-left font-semibold">Bill No</th>
                  <th className="px-3 sm:px-4 py-3 text-left font-semibold">Order Track</th>
                  <th className="px-3 sm:px-4 py-3 text-left font-semibold">Item</th>
                  <th className="px-3 sm:px-4 py-3 text-left font-semibold">Amount</th>
                  <th className="px-3 sm:px-4 py-3 text-left font-semibold">Advance</th>
                  <th className="px-3 sm:px-4 py-3 text-left font-semibold">Pending</th>
                  <th className="px-3 sm:px-4 py-3 text-left font-semibold">Created By</th>
                  <th className="px-3 sm:px-4 py-3 text-left font-semibold">Actions</th>
                </tr>
              </thead>
              <tbody className={`divide-y ${theme === 'dark' ? 'divide-gray-700' : 'divide-gray-200'}`}>
                {filteredBills.length > 0 ? filteredBills.map((bill) => (
                  <tr key={bill.id} className={theme === 'dark' ? 'hover:bg-gray-700/50' : 'hover:bg-gray-50'}>
                    <td className="px-3 sm:px-4 py-3">{bill.name}</td>
                    <td className="px-3 sm:px-4 py-3 font-mono">+{bill.phone}</td>
                    <td className="px-3 sm:px-4 py-3 font-semibold">{bill.billNo}</td>
                    <td className="px-3 sm:px-4 py-3">{bill.orderTrack}</td>
                    <td className="px-3 sm:px-4 py-3">{bill.item}</td>
                    <td className="px-3 sm:px-4 py-3 font-semibold">₹{bill.amount}</td>
                    <td className="px-3 sm:px-4 py-3 text-green-500">₹{bill.down}</td>
                    <td className="px-3 sm:px-4 py-3 text-red-500 font-semibold">₹{bill.pending}</td>
                    <td className="px-3 sm:px-4 py-3 text-xs opacity-70">{bill.created_by || '—'}</td>
                    <td className="px-3 sm:px-4 py-3">
                      <div className="flex flex-wrap gap-1">
                        <button onClick={() => handleEdit(bill)}
                          className="px-2.5 py-1 bg-blue-500 text-white rounded hover:bg-blue-600 text-xs">Edit</button>
                        <button onClick={() => sendWhatsApp(bill)}
                          className="px-2.5 py-1 bg-green-600 text-white rounded hover:bg-green-700 text-xs">💬 WA</button>
                        {isAdmin && (
                          <button onClick={() => handleDelete(bill.id)}
                            className="px-2.5 py-1 bg-red-600 text-white rounded hover:bg-red-700 text-xs">Delete</button>
                        )}
                      </div>
                    </td>
                  </tr>
                )) : (
                  <tr><td colSpan={10} className="px-6 py-8 text-center text-gray-400">
                    No bills found. Start by adding a new bill!
                  </td></tr>
                )}
              </tbody>
            </table>
          </div>
        </div>

        <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 mt-6">
          <div className={`${cardClass} border rounded-lg p-4 text-center shadow-sm`}>
            <p className={`text-xs sm:text-sm ${theme === 'dark' ? 'text-gray-400' : 'text-gray-600'}`}>Total Bills</p>
            <p className="text-xl sm:text-2xl font-bold mt-2">{filteredBills.length}</p>
          </div>
          <div className={`${cardClass} border rounded-lg p-4 text-center shadow-sm`}>
            <p className={`text-xs sm:text-sm ${theme === 'dark' ? 'text-gray-400' : 'text-gray-600'}`}>Total Amount</p>
            <p className="text-xl sm:text-2xl font-bold mt-2">₹{filteredBills.reduce((s, b) => s + b.amount, 0)}</p>
          </div>
          <div className={`${cardClass} border rounded-lg p-4 text-center shadow-sm`}>
            <p className={`text-xs sm:text-sm ${theme === 'dark' ? 'text-gray-400' : 'text-gray-600'}`}>Total Pending</p>
            <p className="text-xl sm:text-2xl font-bold text-red-500 mt-2">₹{filteredBills.reduce((s, b) => s + b.pending, 0)}</p>
          </div>
        </div>
      </div>

      <DisclaimerFooter theme={theme} />
    </div>
  );
}

/* ============================================================
   APP — GATE (login → dashboard)
   ============================================================ */
function App() {
  const [session, setSession]   = useState(() => {
    try {
      const token = localStorage.getItem(TOKEN_KEY);
      const user  = JSON.parse(localStorage.getItem(USER_KEY) || 'null');
      return token && user ? { token, user } : null;
    } catch { return null; }
  });
  const [checking, setChecking] = useState(true);

  useEffect(() => {
    if (!session) { setChecking(false); return; }
    api('/api/me', { token: session.token })
      .then((user) => setSession({ token: session.token, user }))
      .catch(() => {
        localStorage.removeItem(TOKEN_KEY);
        localStorage.removeItem(USER_KEY);
        setSession(null);
      })
      .finally(() => setChecking(false));
  }, []);

  const handleLogin = (data) => {
    const next = {
      token: data.token,
      user: { user_id: data.user_id, role: data.role, name: data.name },
    };
    localStorage.setItem(TOKEN_KEY, next.token);
    localStorage.setItem(USER_KEY, JSON.stringify(next.user));
    setSession(next);
  };

  const handleLogout = async () => {
    try { await api('/api/logout', { method: 'POST', token: session?.token }); } catch {}
    localStorage.removeItem(TOKEN_KEY);
    localStorage.removeItem(USER_KEY);
    setSession(null);
  };

  if (checking) return (
    <div className="min-h-screen flex items-center justify-center text-gray-500">Loading…</div>
  );

  if (!session) return <LoginScreen onLogin={handleLogin} />;
  return <BillingDashboard session={session} onLogout={handleLogout} />;
}

ReactDOM.render(<App />, document.getElementById('root'));
</script>
</body>
</html>
